<!DOCTYPE html> <!-- Tells the browser this document is written in HTML5 -->
<html lang="en"> <!-- Opens the root element; lang="en" says the page language is English -->
<head> <!-- Opens the head section, which holds information ABOUT the page (not displayed on the page) -->
    <meta charset="UTF-8"> <!-- Sets UTF-8 character encoding so special characters like the copyright symbol display correctly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes the page fit and scale properly on phones and tablets -->
    <title>My First Web Page</title> <!-- Sets the text shown in the browser tab -->
    <style> /* Opens a style block where CSS (the visual styling) is written */
        body { /* Starts the style rule for the entire page body */
            font-family: Arial, Helvetica, sans-serif; /* Sets the text font, falling back to any sans-serif font if Arial is missing */
            background-color: #f4f6f8; /* Sets a light gray background color for the page */
            color: #333333; /* Sets the default text color to dark gray */
            margin: 0; /* Removes the browser's default space outside the body */
            padding: 20px; /* Adds 20 pixels of space inside the body edges */
        } /* Ends the body rule */
        main { /* Starts the style rule for the main content box */
            max-width: 700px; /* Stops the box from getting wider than 700 pixels so text lines stay readable */
            margin: 40px auto; /* Puts 40px of space above/below and centers the box left-to-right */
            background-color: #ffffff; /* Gives the box a white background */
            padding: 30px; /* Adds 30 pixels of space between the box edge and its content */
            border-radius: 8px; /* Rounds the corners of the box */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); /* Adds a soft shadow around the box (x offset, y offset, blur, color) */
        } /* Ends the main rule */
        h1 { /* Starts the style rule for the main heading */
            color: #1a3d6d; /* Colors the heading text dark blue */
            border-bottom: 2px solid #1a3d6d; /* Draws a solid 2 pixel dark blue line under the heading */
            padding-bottom: 10px; /* Adds 10 pixels of space between the heading text and that line */
        } /* Ends the h1 rule */
        footer { /* Starts the style rule for the footer */
            text-align: center; /* Centers the footer text horizontally */
            font-size: 0.9em; /* Makes the footer text slightly smaller than normal text */
            color: #666666; /* Makes the footer text a lighter gray */
            margin-top: 20px; /* Adds 20 pixels of space above the footer */
        } /* Ends the footer rule */
    </style> <!-- Closes the style block -->
</head> <!-- Closes the head section -->
<body> <!-- Opens the body section, which holds everything visible on the page -->
    <main> <!-- Opens the main content area of the page -->
        <h1>My First Web Page</h1> <!-- Displays the main heading (h1 = top-level heading) -->
        <p><strong>Username:</strong> sjl333</p> <!-- Paragraph showing the username; <strong> makes the label bold -->
        <p><strong>Course Name:</strong> Introduction to Website Development</p> <!-- Paragraph showing the course name -->
        <p><strong>Course Number:</strong> IS117</p> <!-- Paragraph showing the course number -->
        <p><strong>Section:</strong> 001</p> <!-- Paragraph showing the section number -->
    </main> <!-- Closes the main content area -->
    <footer> <!-- Opens the footer, which holds closing information for the page -->
        <p>&copy; Sean Lee | Due Date: 10/06/2026</p> <!-- &copy; displays the copyright symbol, followed by the name and due date -->
    </footer> <!-- Closes the footer -->
</body> <!-- Closes the body section -->
</html> <!-- Closes the root html element, ending the document -->
